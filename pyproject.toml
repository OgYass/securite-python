[tool.poetry]
name = "template-code"
version = "0.1.0"
description = ""
authors = ["Thibaud ROBIN <trobin@esgi.com>","grp-78bd9692-f2d6-4830-a889-6ec70582acbe-be0234"]
readme = "README.md"
packages = [
  { include = "src" },
  { include = "tp1", from = "src" },
  { include = "tp2", from = "src" },
  { include = "tp3", from = "src" },
]

[tool.poetry.dependencies]
python = "^3.11"
requests = "^2.32.3"
scapy = "^2.6.0"
pygal = "^3.0.5"
pytest = "==9.1.1"
capstone = "^5.0.6"
python-dotenv = "^1.2.1"
matplotlib = "^3.11.2"
reportlab = "^5.0.1"
python-magic-standalone = "^0.4.28"
lief = "^1.0.0"
pymupdf = "^2.0"
fpdf2 = "^2.9.0"
yara-python = "^4.5.4"

[tool.poetry.group.dev.dependencies]
pytest-cov = "^6.2.1"
pre-commit = "^4.7.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
tp1 = "tp1.main:main"
tp2 = "tp2.main:main"
tp3 = "tp3.main:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
